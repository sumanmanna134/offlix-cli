services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-server
    restart: always
    ports:
      - '1433:1433'
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: ${PASSWORD}
    volumes:
      - sqlserver-data:/var/opt/mssql
volumes:
  sqlserver-data:
    driver: local
